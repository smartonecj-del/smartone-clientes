name: Testes de segurança

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar segurança sem credenciais reais
        run: python -m unittest -v test_security
